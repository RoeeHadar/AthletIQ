# Implements: FR-009, FR-014, FR-018, FR-019, FR-022, FR-023, FR-024, FR-025, CON-004, ADR-008, ADR-009, NFR-002, NFR-004, CR-004, CR-005
openapi: 3.0.3
info:
  title: AthletIQ Demo API
  version: 1.0.0
  description: >
    Prediction API (sync, game_id-keyed). CR-004: per-league pins, labeled synthetic
    Market P. No application auth (ADR-009). No hard latency SLO (NFR-004).
    See docs/06-design/api-design.md.
servers:
  - url: http://localhost:8000
    description: Local Compose
security: []
paths:
  /v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Healthy
        "503":
          description: model_unavailable or db_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/predict:
    get:
      summary: Predict home-win probability for a game
      parameters:
        - name: game_id
          in: query
          required: false
          schema:
            type: string
          description: Internal BIGINT game id as string
        - name: provider_game_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResponse"
        "400":
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: game_not_found or features_not_found (see error.code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: model_unavailable or db_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/model:
    get:
      summary: Model metadata and limitations
      parameters:
        - name: league
          in: query
          required: false
          schema:
            type: string
            enum: [nba, wnba]
          description: Served pin for this league (default NBA)
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInfo"
        "503":
          description: model_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/slate:
    get:
      summary: Next 20 unplayed pre-tip games plus the demo user's open stakes
      parameters:
        - name: user
          in: query
          required: false
          schema: { type: string, enum: [demo-1, demo-2], default: demo-1 }
      responses:
        "200":
          description: Slate payload (display only; does not settle)
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/board:
    get:
      summary: In-progress games only
      responses:
        "200":
          description: Board payload
        "503":
          description: db_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/users/{slug}/wallet:
    get:
      summary: Integer e-coin balance for a demo user
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Wallet
        "404":
          description: user_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/stakes:
    post:
      summary: Place or replace an even-money stake (replace default false)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, game_id, side, amount]
              properties:
                user: { type: string }
                game_id: { type: integer }
                side: { type: string, enum: [home, away] }
                amount: { type: integer, minimum: 1 }
                replace: { type: boolean, default: false }
      responses:
        "200":
          description: Stake row
        "400":
          description: invalid_request, insufficient_balance, or stake_window_closed
        "404":
          description: game_not_found or user_not_found
        "409":
          description: duplicate_open_stake
  /v1/stakes/{id}/cancel:
    post:
      summary: Cancel an open stake before tip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
      responses:
        "200":
          description: Canceled stake
        "400":
          description: invalid_request or stake_window_closed
components:
  securitySchemes: {}
  schemas:
    PredictionResponse:
      type: object
      required: [game_id, home_win_pred, p_home_win, model_version, feature_version]
      properties:
        game_id: { type: string }
        home_team_id: { type: string }
        away_team_id: { type: string }
        home_team_name: { type: string, nullable: true }
        home_team_abbreviation: { type: string, nullable: true }
        away_team_name: { type: string, nullable: true }
        away_team_abbreviation: { type: string, nullable: true }
        home_win_pred: { type: boolean }
        p_home_win: { type: number, minimum: 0, maximum: 1 }
        league: { type: string, description: nba or wnba }
        market_p_home_win: { type: number, minimum: 0, maximum: 1, nullable: true }
        market_source: { type: string, nullable: true, description: synthetic when present }
        model_version: { type: string }
        feature_version: { type: string }
        dataset_version: { type: string }
        limitations_ref: { type: string }
        model_card_ref: { type: string }
    ModelInfo:
      type: object
      required: [model_version, feature_version, limitations, methodology, model_card_ref]
      properties:
        model_version: { type: string }
        feature_version: { type: string }
        dataset_version: { type: string }
        metrics: { type: object }
        methodology: { type: object }
        limitations: { type: string }
        model_card_ref: { type: string }
        baselines_served: { type: boolean }
        league: { type: string, description: nba or wnba }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - game_not_found
                - features_not_found
                - model_unavailable
                - db_unavailable
                - internal_error
                - insufficient_balance
                - stake_window_closed
                - user_not_found
                - duplicate_open_stake
            message: { type: string }
            details: { type: object }
