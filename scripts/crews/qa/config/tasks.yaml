# Engineering QA tasks (not AthletIQ runtime). Designed per CrewAI design-task skill.

audit_coverage:
  description: >
    Compare SRS Must requirements (FR/DR/ML/SEC/NFR/OPS/CON, CR-001-amended)
    to TEST-001…014 in docs/08-testing/test-plan.md and the Test column in
    docs/03-requirements/traceability.md.

    Steps:
    1. List every Must requirement id.
    2. Confirm each has at least one TEST id.
    3. Separate automated CI coverage from attestation (NFR-001 clean-machine,
       DR-001 two live seasons, ML-005 frozen NBA holdout, OPS-001 remote GHA).
    4. Do not propose player ingest tests (CR-001) or Compose bring-up pytest
       (LEAD-001 closed that as not required).
  expected_output: >
    A coverage table: requirement id, TEST ids, automated vs attestation,
    and any true holes (Must with no TEST). One paragraph verdict.
  agent: coverage_auditor

run_documented_tests:
  description: >
    Execute pytest for TEST-001…014 using the mapping in
    scripts/crews/qa/test_map.json. No API_SPORTS_KEY. Use TEST_DATABASE_URL
    only if it is already a disposable test database.
  expected_output: >
    Per TEST-XXX: pytest node outcome (passed / failed / skipped) and whether
    that matches the test-plan Status qualifier (in-memory, synthetic, static
    topology, TEST_DATABASE_URL-gated).
  agent: qa_runner
  context:
    - audit_coverage
