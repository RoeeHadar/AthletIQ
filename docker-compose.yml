# Implements: FR-012, FR-026, CON-003, ADR-001, ADR-004, ADR-006, ADR-015, CR-004, CR-005
# AthletIQ local multi-service topology (database + etl + api).
# Credentials via env / .env — local demo defaults only (ADR-009: bind localhost).

services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athletiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athletiq}
      POSTGRES_DB: ${POSTGRES_DB:-athletiq}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./database/migrations/002_cr004_league_players_odds.sql:/docker-entrypoint-initdb.d/002_cr004_league_players_odds.sql:ro
      - ./database/migrations/003_cr005_ledger_game_lifecycle.sql:/docker-entrypoint-initdb.d/003_cr005_ledger_game_lifecycle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-athletiq} -d ${POSTGRES_DB:-athletiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-athletiq}:${POSTGRES_PASSWORD:-athletiq}@database:5432/${POSTGRES_DB:-athletiq}
      API_SPORTS_KEY: ${API_SPORTS_KEY:-}
      ATHLETIQ_SEED: ${ATHLETIQ_SEED:-42}
      ATHLETIQ_RAW_PATH: /data/raw
      ATHLETIQ_ARTIFACTS_PATH: /artifacts
      ATHLETIQ_LOG_LEVEL: ${ATHLETIQ_LOG_LEVEL:-INFO}
    volumes:
      - raw_data:/data/raw
      - artifacts:/artifacts
    depends_on:
      database:
        condition: service_healthy
    # Batch image: keep container up for `compose exec`; run pipeline via:
    #   docker compose run --rm etl python -m athletiq.pipeline --store postgres --provider fixture
    # Board poll (same image, not a fourth service; newest pages only):
    #   docker compose exec etl python -m athletiq.board_poll --interval 30
    command: ["sleep", "infinity"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-athletiq}:${POSTGRES_PASSWORD:-athletiq}@database:5432/${POSTGRES_DB:-athletiq}
      ATHLETIQ_SEED: ${ATHLETIQ_SEED:-42}
      ATHLETIQ_RAW_PATH: /data/raw
      ATHLETIQ_ARTIFACTS_PATH: /artifacts
      ATHLETIQ_LOG_LEVEL: ${ATHLETIQ_LOG_LEVEL:-INFO}
      ATHLETIQ_STORE: postgres
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - raw_data:/data/raw
      - artifacts:/artifacts
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  raw_data:
  artifacts:
